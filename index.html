<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Grid Layout</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-gradient-to-br from-slate-900 via-slate-800 to-slate-900 min-h-screen p-4 lg:p-8">
    
    <section class="max-w-7xl mx-auto">
        
        <div class="hidden md:grid md:grid-cols-12 md:grid-rows-12 gap-3 lg:gap-4 h-[600px] lg:h-[900px]">
            
            <!-- div1 -->
            <div class="col-start-11 col-end-13 row-start-1 row-end-8 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/700?random=1" 
                     alt="Gallery 1" 
                     class="w-full h-full object-cover transition-all duration-500 group-hover:scale-110 group-hover:rotate-2">
                <div class="absolute inset-0 bg-gradient-to-t from-black/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute bottom-4 right-4 bg-white/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-slate-800 transition-all duration-300 group-hover:bg-white group-hover:scale-110">
                    Architecture
                </div>
            </div>
            
            <!-- div2 -->
            <div class="col-start-11 col-end-13 row-start-8 row-end-13 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=2" 
                     alt="Gallery 2" 
                     class="w-full h-full object-cover transition-all duration-500 group-hover:scale-110 group-hover:-rotate-2">
                <div class="absolute inset-0 bg-gradient-to-t from-purple-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute bottom-4 right-4 bg-purple-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-purple-500 group-hover:scale-110">
                    Travel
                </div>
            </div>
            
            <!-- div3 -->
            <div class="col-start-1 col-end-3 row-start-1 row-end-6 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=3" 
                     alt="Gallery 3" 
                     class="w-full h-full object-cover transition-all duration-700 group-hover:scale-125">
                <div class="absolute inset-0 bg-gradient-to-br from-blue-600/40 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute bottom-4 left-4 bg-blue-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-blue-500 group-hover:scale-110">
                    Nature
                </div>
            </div>
            
            <!-- div4 -->
            <div class="col-start-1 col-end-3 row-start-6 row-end-13 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/700?random=4" 
                     alt="Gallery 4" 
                     class="w-full h-full object-cover transition-all duration-500 group-hover:scale-110">
                <div class="absolute inset-0 bg-gradient-to-t from-emerald-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute bottom-4 left-4 bg-emerald-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-emerald-500 group-hover:scale-110">
                    Wildlife
                </div>
            </div>
            
            <!-- div5 -->
            <div class="col-start-6 col-end-11 row-start-7 row-end-13 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/900/600?random=5" 
                     alt="Gallery 5" 
                     class="w-full h-full object-cover transition-all duration-700 group-hover:scale-105">
                <div class="absolute inset-0 bg-gradient-to-tr from-orange-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute bottom-4 left-4 bg-orange-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-orange-500 group-hover:scale-110">
                    Food & Drinks
                </div>
            </div>
            
            <!-- div6 -->
            <div class="col-start-3 col-end-8 row-start-1 row-end-7 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/900/600?random=6" 
                     alt="Gallery 6" 
                     class="w-full h-full object-cover transition-all duration-500 group-hover:scale-110 group-hover:brightness-110">
                <div class="absolute inset-0 bg-gradient-to-bl from-pink-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute top-4 left-4 bg-pink-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-pink-500 group-hover:scale-110">
                    Fashion
                </div>
            </div>
            
            <!-- div7 -->
            <div class="col-start-3 col-end-6 row-start-7 row-end-13 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/600/700?random=7" 
                     alt="Gallery 7" 
                     class="w-full h-full object-cover transition-all duration-700 group-hover:scale-110">
                <div class="absolute inset-0 bg-gradient-to-r from-cyan-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute bottom-4 left-4 bg-cyan-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-cyan-500 group-hover:scale-110">
                    Sports
                </div>
            </div>
            
            <!-- div8 -->
            <div class="col-start-8 col-end-11 row-start-1 row-end-7 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/700/600?random=8" 
                     alt="Gallery 8" 
                     class="w-full h-full object-cover transition-all duration-500 group-hover:scale-110">
                <div class="absolute inset-0 bg-gradient-to-l from-indigo-900/60 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-300"></div>
                <div class="absolute top-4 right-4 bg-indigo-500/90 backdrop-blur-sm px-4 py-2 rounded-full text-sm font-bold text-white transition-all duration-300 group-hover:bg-indigo-500 group-hover:scale-110">
                    Technology
                </div>
            </div>
        </div>

        <!-- Mobile/Tablet Grid -->
        <div class="grid md:hidden grid-cols-2 gap-3 auto-rows-[200px] sm:auto-rows-[250px]">
            <div class="group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=1" alt="Gallery 1" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute bottom-3 right-3 bg-white/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-slate-800">
                    Architecture
                </div>
            </div>
            <div class="group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=2" alt="Gallery 2" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute bottom-3 right-3 bg-purple-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Travel
                </div>
            </div>
            <div class="col-span-2 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/800/400?random=3" alt="Gallery 3" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute bottom-3 left-3 bg-blue-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Nature
                </div>
            </div>
            <div class="group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=4" alt="Gallery 4" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute bottom-3 left-3 bg-emerald-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Wildlife
                </div>
            </div>
            <div class="group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=5" alt="Gallery 5" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute bottom-3 right-3 bg-orange-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Food & Drinks
                </div>
            </div>
            <div class="col-span-2 group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/800/400?random=6" alt="Gallery 6" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute top-3 left-3 bg-pink-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Fashion
                </div>
            </div>
            <div class="group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=7" alt="Gallery 7" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute bottom-3 left-3 bg-cyan-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Sports
                </div>
            </div>
            <div class="group relative overflow-hidden rounded-2xl">
                <img src="https://picsum.photos/400/500?random=8" alt="Gallery 8" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-110">
                <div class="absolute top-3 right-3 bg-indigo-500/90 backdrop-blur-sm px-3 py-1.5 rounded-full text-xs font-bold text-white">
                    Technology
                </div>
            </div>
        </div>
    </section>

</body>
</html>
